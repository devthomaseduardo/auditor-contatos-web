services:
  api:
    build: .
    container_name: auditor-contatos-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/auditor_contatos
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: auditor-contatos-db
    environment:
      POSTGRES_DB: auditor_contatos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d auditor_contatos",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
