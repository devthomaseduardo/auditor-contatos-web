name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 auditor tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 auditor tests --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Run tests
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci_test.db
        run: |
          pytest -q
